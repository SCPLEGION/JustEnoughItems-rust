[mod]
id = "jei"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "e8cdbd5c375f1b7b662c1157ddca3f09489e36d2"

# All of JEI's logic: a plain crate staged into Horizon's workspace (horizon-mixins bundle crates).
[[crate]]
id = "core"
path = "core"

# Glue that lives inside the game crate: reads the game's items and recipes and draws the lists.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "jei"
source = "runtime.rs"

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "container-draw"
hook = "container_draw"
hook_version = 1
kind = "HEAD"
helper = "container_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "window", ty = "[f32; 4]", value = "window" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "container-click"
hook = "container_click"
hook_version = 1
kind = "HEAD"
helper = "container_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "window", ty = "[f32; 4]", value = "window" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "button", ty = "u8", value = "button" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "container-key"
hook = "container_key"
hook_version = 1
kind = "HEAD"
helper = "container_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "text", ty = "Option<&str>", value = "text" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "container-wheel"
hook = "container_wheel"
hook_version = 1
kind = "HEAD"
helper = "container_wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "container-release"
hook = "container_release"
hook_version = 1
kind = "HEAD"
helper = "container_release.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "window", ty = "[f32; 4]", value = "window" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "button", ty = "u8", value = "button" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]
